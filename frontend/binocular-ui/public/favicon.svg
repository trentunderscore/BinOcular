<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#090a0f"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#1e293b" stroke-width="2"/>

  <!-- Radar sweep / Ocular Lens Left -->
  <circle cx="24" cy="32" r="14" fill="#111827" stroke="url(#primaryGrad)" stroke-width="2.5"/>
  <circle cx="24" cy="32" r="8" fill="url(#glowGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="24" cy="32" r="3" fill="#38bdf8"/>

  <!-- Radar sweep / Ocular Lens Right -->
  <circle cx="40" cy="32" r="14" fill="#111827" stroke="url(#primaryGrad)" stroke-width="2.5"/>
  <circle cx="40" cy="32" r="8" fill="url(#glowGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="40" cy="32" r="3" fill="#38bdf8"/>

  <!-- Crosshair bridge -->
  <path d="M24 18V22M24 42V46M40 18V22M40 42V46M10 32H14M50 32H54" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  <rect x="29" y="30" width="6" height="4" rx="2" fill="url(#primaryGrad)"/>
</svg>
